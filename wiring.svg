<svg xmlns="http://www.w3.org/2000/svg" width="700" height="830" viewBox="0 0 700 830" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="830" fill="#ffffff"/>
  <text x="350" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">Waveshare 2.9-inch e-paper to Raspberry Pi Zero 2 W</text>
  <text x="350" y="50" font-size="12" text-anchor="middle" fill="#555">GPIO header, physical pin numbers. Pin 1 (square) is at the top left. Wire with the Pi powered off.</text>

  <!-- header body -->
  <rect x="318" y="68" width="64" height="694" rx="6" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>

  <!-- connection lines -->
  <g stroke-width="4" stroke-linecap="round">
    <line x1="290" y1="90" x2="338" y2="90" stroke="#888888"/>
    <line x1="362" y1="158" x2="410" y2="158" stroke="#222222"/>
    <line x1="290" y1="260" x2="338" y2="260" stroke="#db2777"/>
    <line x1="362" y1="362" x2="410" y2="362" stroke="#7e22ce"/>
    <line x1="290" y1="396" x2="338" y2="396" stroke="#1d4ed8"/>
    <line x1="362" y1="430" x2="410" y2="430" stroke="#16a34a"/>
    <line x1="290" y1="464" x2="338" y2="464" stroke="#ca8a04"/>
    <line x1="362" y1="464" x2="410" y2="464" stroke="#ea580c"/>
  </g>

  <!-- pins: left column (odd) -->
  <g font-size="9" text-anchor="middle" fill="#fff">
    <rect x="329" y="81" width="18" height="18" fill="#888888"/><text x="338" y="94">1</text>
    <circle cx="338" cy="124" r="9" fill="#9ca3af"/><text x="338" y="127">3</text>
    <circle cx="338" cy="158" r="9" fill="#9ca3af"/><text x="338" y="161">5</text>
    <circle cx="338" cy="192" r="9" fill="#9ca3af"/><text x="338" y="195">7</text>
    <circle cx="338" cy="226" r="9" fill="#374151"/><text x="338" y="229">9</text>
    <circle cx="338" cy="260" r="9" fill="#db2777"/><text x="338" y="263">11</text>
    <circle cx="338" cy="294" r="9" fill="#9ca3af"/><text x="338" y="297">13</text>
    <circle cx="338" cy="328" r="9" fill="#9ca3af"/><text x="338" y="331">15</text>
    <circle cx="338" cy="362" r="9" fill="#9ca3af"/><text x="338" y="365">17</text>
    <circle cx="338" cy="396" r="9" fill="#1d4ed8"/><text x="338" y="399">19</text>
    <circle cx="338" cy="430" r="9" fill="#9ca3af"/><text x="338" y="433">21</text>
    <circle cx="338" cy="464" r="9" fill="#ca8a04"/><text x="338" y="467">23</text>
    <circle cx="338" cy="498" r="9" fill="#374151"/><text x="338" y="501">25</text>
    <circle cx="338" cy="532" r="9" fill="#9ca3af"/><text x="338" y="535">27</text>
    <circle cx="338" cy="566" r="9" fill="#9ca3af"/><text x="338" y="569">29</text>
    <circle cx="338" cy="600" r="9" fill="#9ca3af"/><text x="338" y="603">31</text>
    <circle cx="338" cy="634" r="9" fill="#9ca3af"/><text x="338" y="637">33</text>
    <circle cx="338" cy="668" r="9" fill="#9ca3af"/><text x="338" y="671">35</text>
    <circle cx="338" cy="702" r="9" fill="#9ca3af"/><text x="338" y="705">37</text>
    <circle cx="338" cy="736" r="9" fill="#374151"/><text x="338" y="739">39</text>
  </g>

  <!-- pins: right column (even) -->
  <g font-size="9" text-anchor="middle" fill="#fff">
    <circle cx="362" cy="90" r="9" fill="#9ca3af"/><text x="362" y="93">2</text>
    <circle cx="362" cy="124" r="9" fill="#9ca3af"/><text x="362" y="127">4</text>
    <circle cx="362" cy="158" r="9" fill="#222222"/><text x="362" y="161">6</text>
    <circle cx="362" cy="192" r="9" fill="#9ca3af"/><text x="362" y="195">8</text>
    <circle cx="362" cy="226" r="9" fill="#9ca3af"/><text x="362" y="229">10</text>
    <circle cx="362" cy="260" r="9" fill="#9ca3af"/><text x="362" y="263">12</text>
    <circle cx="362" cy="294" r="9" fill="#374151"/><text x="362" y="297">14</text>
    <circle cx="362" cy="328" r="9" fill="#9ca3af"/><text x="362" y="331">16</text>
    <circle cx="362" cy="362" r="9" fill="#7e22ce"/><text x="362" y="365">18</text>
    <circle cx="362" cy="396" r="9" fill="#374151"/><text x="362" y="399">20</text>
    <circle cx="362" cy="430" r="9" fill="#16a34a"/><text x="362" y="433">22</text>
    <circle cx="362" cy="464" r="9" fill="#ea580c"/><text x="362" y="467">24</text>
    <circle cx="362" cy="498" r="9" fill="#9ca3af"/><text x="362" y="501">26</text>
    <circle cx="362" cy="532" r="9" fill="#9ca3af"/><text x="362" y="535">28</text>
    <circle cx="362" cy="566" r="9" fill="#374151"/><text x="362" y="569">30</text>
    <circle cx="362" cy="600" r="9" fill="#9ca3af"/><text x="362" y="603">32</text>
    <circle cx="362" cy="634" r="9" fill="#374151"/><text x="362" y="637">34</text>
    <circle cx="362" cy="668" r="9" fill="#9ca3af"/><text x="362" y="671">36</text>
    <circle cx="362" cy="702" r="9" fill="#9ca3af"/><text x="362" y="705">38</text>
    <circle cx="362" cy="736" r="9" fill="#9ca3af"/><text x="362" y="739">40</text>
  </g>

  <!-- unused pin labels: left -->
  <g font-size="11" text-anchor="end" fill="#6b7280">
    <text x="310" y="128">GPIO2</text>
    <text x="310" y="162">GPIO3</text>
    <text x="310" y="196">GPIO4</text>
    <text x="310" y="230">GND</text>
    <text x="310" y="298">GPIO27</text>
    <text x="310" y="332">GPIO22</text>
    <text x="310" y="366">3V3</text>
    <text x="310" y="434">GPIO9</text>
    <text x="310" y="502">GND</text>
    <text x="310" y="536">ID_SD</text>
    <text x="310" y="570">GPIO5</text>
    <text x="310" y="604">GPIO6</text>
    <text x="310" y="638">GPIO13</text>
    <text x="310" y="672">GPIO19</text>
    <text x="310" y="706">GPIO26</text>
    <text x="310" y="740">GND</text>
  </g>

  <!-- unused pin labels: right -->
  <g font-size="11" text-anchor="start" fill="#6b7280">
    <text x="390" y="94">5V</text>
    <text x="390" y="128">5V</text>
    <text x="390" y="196">GPIO14</text>
    <text x="390" y="230">GPIO15</text>
    <text x="390" y="264">GPIO18</text>
    <text x="390" y="298">GND</text>
    <text x="390" y="332">GPIO23</text>
    <text x="390" y="400">GND</text>
    <text x="390" y="502">GPIO7</text>
    <text x="390" y="536">ID_SC</text>
    <text x="390" y="570">GND</text>
    <text x="390" y="604">GPIO12</text>
    <text x="390" y="638">GND</text>
    <text x="390" y="672">GPIO16</text>
    <text x="390" y="706">GPIO20</text>
    <text x="390" y="740">GPIO21</text>
  </g>

  <!-- used connections: display pin name on the pill -->
  <g font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">
    <rect x="100" y="78" width="190" height="24" rx="12" fill="#888888"/>
    <text x="195" y="94">VCC  =  3V3  (pin 1)</text>

    <rect x="410" y="146" width="190" height="24" rx="12" fill="#222222"/>
    <text x="505" y="162">GND  =  GND  (pin 6)</text>

    <rect x="100" y="248" width="190" height="24" rx="12" fill="#db2777"/>
    <text x="195" y="264">RST  =  GPIO17  (pin 11)</text>

    <rect x="410" y="350" width="190" height="24" rx="12" fill="#7e22ce"/>
    <text x="505" y="366">BUSY  =  GPIO24  (pin 18)</text>

    <rect x="100" y="384" width="190" height="24" rx="12" fill="#1d4ed8"/>
    <text x="195" y="400">DIN  =  GPIO10  (pin 19)</text>

    <rect x="410" y="418" width="190" height="24" rx="12" fill="#16a34a"/>
    <text x="505" y="434">DC  =  GPIO25  (pin 22)</text>

    <rect x="100" y="452" width="190" height="24" rx="12" fill="#ca8a04"/>
    <text x="195" y="468">CLK  =  GPIO11  (pin 23)</text>

    <rect x="410" y="452" width="190" height="24" rx="12" fill="#ea580c"/>
    <text x="505" y="468">CS  =  GPIO8  (pin 24)</text>
  </g>

  <text x="350" y="800" font-size="12" text-anchor="middle" fill="#555">Each colored label reads: display module pin = Raspberry Pi pin.</text>
</svg>
